name: Update MobiList
on:
  schedule:
    - cron: '08 19 * * *'  # UTC 19:08（ Beijing 03:08 ）
  workflow_dispatch:
  push:
    paths:
      - 'rules/supple.txt'

permissions:
  contents: write

jobs:
  update-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Run update script
        run: |
          bash scripts/matrix_get.sh
          bash scripts/matrix_lighten.sh
          bash scripts/matrix_fuel.sh      
          bash scripts/matrix_launch.sh

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v10
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: "Update MobiList"
          add: rules/MobiList.txt
          pull: '--rebase --autostash'
          push: true
          push_attempts: 3

      - name: Refresh jsDelivr cache
        run: |
          curl -Ls -X GET "https://purge.jsdelivr.net/gh/Lky777/MWCP/rules/MobiList.txt"

      - name: Final cleanup
        if: always()
        run: |
          rm -rf rules/ easylist/ scripts/
